name: Desplega la web a Hostinger

on:
  push:
    branches: [main]
    paths: ['public/**']
  workflow_dispatch:
  # Els commits del Content Hub es fan amb el GITHUB_TOKEN per defecte, i GitHub
  # Actions no encadena workflows a partir d'aquests pushos. Per aixo tambe ens
  # activem quan qualsevol workflow del Content Hub acaba correctament.
  workflow_run:
    workflows:
      - "Content Hub — completar l'edició"
      - "Content Hub — fotografia editorial diària"
      - "Content Hub — peces setmanals"
      - "Àudio de l'edició (veu en català)"
      - "Auto-fusiona els lots de les tasques"
    types: [completed]
  # Xarxa de seguretat (25.07.2026): desplegament incremental cada hora.
  # Si tot es al dia, acaba en ~1 min sense pujar res; si un desplegament
  # anterior havia fallat (FTP de Hostinger caigut), aquesta passada ho
  # repesca sola i la web mai queda endarrerida mes d'una hora.
  # 30.07.2026: dues passades per hora i en minuts no rodons. GitHub deixa
  # caure moltes execucions programades, sobretot als minuts mes congestionats
  # (:00 :15 :30 :45 :55). El 30.07 el cron ':45' nomes va disparar 1 cop en
  # tot el dia i la web va quedar hora i mitja endarrerida amb el lot de les
  # 14.05 sense publicar.
  schedule:
    - cron: '8,38 * * * *'

concurrency:
  group: desplega-hostinger
  cancel-in-progress: true

jobs:
  desplega:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descarrega el repositori
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 02.08.2026: transport nou. L'FTP de Hostinger va quedar mut tota la
      # tarda (6 intents x max-retries, run #296 cancellada pel timeout) i el
      # mode mirall/marcador acumulava complexitat per compensar-ne la
      # fragilitat. Amb rsync per SSH no cal cap marcador per decidir que
      # pujar: --checksum compara el contingut real i nomes transfereix el que
      # ha canviat, sigui quin sigui l'estat del servidor. Idempotent per
      # construccio. Sense --delete: els MP3 (assets/audio), config.php,
      # subscribers.csv, mail.log i data/archive.json nomes viuen al servidor.
      # El marcador deploy-sha.txt es conserva NOMES com a diagnostic (el fan
      # servir el vigilant i la xarxa de seguretat), no per decidir res.
      # Mentre els secrets SSH_* no estiguin configurats (o si l'SSH falla),
      # el pas seguent continua fent el desplegament per FTP com fins ara.
      - name: Desplega per rsync/SSH
        id: ssh
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          set -u
          if [ -z "${SSH_KEY:-}" ] || [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "Secrets SSH no configurats; el desplegament es fara per FTP."
            exit 0
          fi
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key" && chmod 600 "$HOME/.ssh/deploy_key"
          PORT="${SSH_PORT:-65002}"
          DEST="${SSH_PATH:-domains/inteligencia-artificial.cat/public_html}"
          SSHCMD="ssh -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o BatchMode=yes"
          HEAD_SHA=$(git rev-parse HEAD)
          printf '%s\n' "$HEAD_SHA" > /tmp/deploy-sha.txt
          for i in 1 2 3; do
            echo "== Intent rsync $i de 3 =="
            if rsync -rltz --checksum --timeout=60 -e "$SSHCMD" public/ "$SSH_USER@$SSH_HOST:$DEST/" \
               && rsync -tz --timeout=60 -e "$SSHCMD" /tmp/deploy-sha.txt "$SSH_USER@$SSH_HOST:$DEST/deploy-sha.txt"; then
              echo "Desplegament rsync acabat (intent $i): $HEAD_SHA"
              echo "deployed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "rsync ha fallat; nou intent d'aqui a 30 s..."
              sleep 30
            fi
          done
          echo "::warning::rsync/SSH ha fallat 3 cops; es prova el desplegament per FTP com a recurs."

      - name: Prepara lftp i restaura les dates dels fitxers
        if: steps.ssh.outputs.deployed != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp git-restore-mtime || sudo apt-get install -y -qq lftp
          # Les dates reals nomes fan falta al mode "mirall complet" (vegeu el
          # pas seguent): permeten que el mirall lftp salti el que no ha canviat.
          git restore-mtime || echo "restore-mtime no disponible: el mirall complet ho pujaria tot"

      - name: Puja public/ per FTP (incremental per git-diff, mirall com a recurs)
        if: steps.ssh.outputs.deployed != 'true'
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Reescriptura de l'01.08.2026. Motiu: el desplegament del lot de les
          # 06.05 va degenerar en una pujada del public/ sencer (104 MB, 400+
          # fitxers) i va trigar mes de 25 min. El mirall lftp "incremental"
          # depenia de comparar dates i mides per FTP (git-restore-mtime +
          # timestamps del servidor): si qualsevol pota falla, degrada en
          # silenci a pujar-ho TOT.
          #
          # Esquema nou, deterministic:
          #  1. Al servidor hi viu /deploy-sha.txt amb el commit desplegat.
          #  2. Cada desplegament el llegeix i puja NOMES els fitxers de
          #     `git diff <sha-desplegat>..HEAD -- public/` (segons, no minuts).
          #  3. El marcador es puja l'ULTIM, nomes si tots els fitxers han
          #     pujat be: si un intent mor a mitges, el seguent repeteix el
          #     mateix diff (idempotent).
          #  4. El mirall complet queda nomes com a recurs: marcador absent,
          #     sha desconegut (force push) o corrupte. Despres d'un mirall bo
          #     tambe es puja el marcador, i es torna al mode rapid.
          #
          # Es conserva de l'enduriment del 25-30.07.2026: TLS nomes al canal
          # de control, sense --delete (els MP3 d'assets/audio nomes viuen al
          # servidor), --parallel=2 (limit de connexions FTP del compte, que
          # l'audio tambe fa servir), 6 intents amb pausa creixent, i timeouts
          # curts perque un servidor mut falli rapid.
          #
          # El mode es decideix DINS de cada intent: si el marcador no s'ha
          # pogut llegir per una fallada passatgera de l'FTP, l'intent seguent
          # ho torna a provar i no queda condemnat al mirall complet.
          set -u
          HOST="ftp://srv1589.hstgr.io"
          CRED="u901078817.claude,$FTP_PASSWORD"
          OPTS="set ftp:ssl-force yes; set ftp:ssl-protect-data no; set net:max-retries 2; set net:timeout 30; set net:reconnect-interval-base 5; set net:reconnect-interval-max 20;"
          HEAD_SHA=$(git rev-parse HEAD)
          printf '%s\n' "$HEAD_SHA" > /tmp/deploy-sha.txt

          intents=6
          pausa=60
          for i in $(seq 1 "$intents"); do
            echo "== Intent $i de $intents =="

            # 1) Llegeix el marcador del servidor (si existeix)
            base=""
            rm -f /tmp/base-sha.txt
            if lftp -u "$CRED" -e "$OPTS get /deploy-sha.txt -o /tmp/base-sha.txt; bye" "$HOST" 2>/dev/null; then
              base=$(tr -cd 'a-f0-9' < /tmp/base-sha.txt | head -c 40)
            fi

            # 1-bis) Guarda (01.08.2026): si el servidor ja serveix un commit
            # MES NOU que el d'aquesta run i que ja conte HEAD, no cal fer res.
            # Passa amb runs encadenades que arrenquen tard o reexecutades:
            # abans queien al mirall complet i re-pujaven un arbre antic.
            if [ ${#base} -eq 40 ] && [ "$base" != "$HEAD_SHA" ] \
               && git cat-file -e "$base^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor HEAD "$base" 2>/dev/null; then
              echo "El servidor ja serveix ${base:0:7}, posterior a $HEAD_SHA. Aquesta run no ha de fer res."
              exit 0
            fi

            # 2) Decideix el mode
            mode="mirall"
            motiu="marcador absent o illegible (primer desplegament o FTP mut)"
            if [ ${#base} -eq 40 ] && git cat-file -e "$base^{commit}" 2>/dev/null && git merge-base --is-ancestor "$base" HEAD 2>/dev/null; then
              if [ "$base" = "$HEAD_SHA" ]; then
                echo "El servidor ja te $HEAD_SHA desplegat. Res a fer."
                exit 0
              fi
              git diff --name-only --no-renames --diff-filter=d "$base" HEAD -- public/ > /tmp/canvis.txt
              n=$(wc -l < /tmp/canvis.txt)
              if [ "$n" -eq 0 ]; then
                echo "Cap fitxer de public/ ha canviat des de ${base:0:7}; nomes s'actualitza el marcador."
                if lftp -u "$CRED" -e "$OPTS put /tmp/deploy-sha.txt -o /deploy-sha.txt; bye" "$HOST"; then
                  exit 0
                fi
                mode=""
              else
                mode="diff"
                echo "Mode incremental: $n fitxer(s) canviats des de ${base:0:7}:"
                sed 's/^/   - /' /tmp/canvis.txt
              fi
            else
              if [ ${#base} -eq 40 ]; then motiu="el sha del servidor ($base) no es cap avantpassat de HEAD"; fi
            fi

            # 3) Construeix i executa el pla de l'intent
            if [ "$mode" = "diff" ]; then
              {
                printf '%s\n' "$OPTS"
                echo "set cmd:fail-exit no"
                sed 's|^public/||' /tmp/canvis.txt | xargs -r -n1 dirname | sort -u | grep -v '^\.$' | \
                  while IFS= read -r d; do printf 'mkdir -p "/%s"\n' "$d"; done
                echo "set cmd:fail-exit yes"
                while IFS= read -r f; do
                  printf 'put "%s" -o "/%s"\n' "$f" "${f#public/}"
                done < /tmp/canvis.txt
                echo 'put /tmp/deploy-sha.txt -o /deploy-sha.txt'
                echo "bye"
              } > /tmp/pla.lftp
              if lftp -u "$CRED" -e "source /tmp/pla.lftp" "$HOST"; then
                echo "Desplegament incremental acabat (intent $i)."
                exit 0
              fi
            elif [ "$mode" = "mirall" ]; then
              echo "Mode mirall complet ($motiu)."
              if lftp -u "$CRED" -e "$OPTS mirror -R --parallel=2 --verbose public/ /; put /tmp/deploy-sha.txt -o /deploy-sha.txt; bye" "$HOST"; then
                echo "Mirall complet acabat (intent $i)."
                exit 0
              fi
            fi

            if [ "$i" -lt "$intents" ]; then
              echo "L'FTP ha fallat; nou intent d'aqui a $pausa s..."
              sleep "$pausa"
              pausa=$((pausa + 60))
            fi
          done
          echo "::error::El desplegament FTP ha fallat despres de $intents intents. Les passades de repesca (:08 i :38) i la xarxa de seguretat ho reintentaran."
          exit 1
