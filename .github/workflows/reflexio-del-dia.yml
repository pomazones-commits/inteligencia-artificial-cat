name: Content Hub — la reflexió del dia

# «La reflexió del dia» (04.08.2026): el balanç que la sessió editorial escriu
# amb l'últim lot de notícies del dia. Arriba com a incoming/daily-reflection.json
# i aquest workflow el valida, el publica a public/reflexio-diaria.js i fa rodar
# l'arxiu (public/reflexions-arxiu.js). Mateix patró que la fotografia diària.
#
# 07.08.2026: aquí hi va haver un `schedule` de repesca (:23) durant unes hores.
# Retirat el mateix matí per coherència amb `content-hub.yml`: la repesca la fa
# la «Xarxa de seguretat», que ara passa cada hora i rellança per
# workflow_dispatch el que calgui. A més, `desplega.yml` s'encadena a aquest
# workflow, o sigui que una passada horària buida aquí n'arrossegava una allà.
#
# El pas «Queda res per publicar?» es queda tot i que ara no s'executa mai: si
# algun dia es torna a afegir un cron, la guarda ja hi és.

on:
  push:
    branches: [main]
    paths:
      - incoming/daily-reflection.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reflexio-del-dia-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar-i-publicar:
    # Els commits del propi bot no es repesquen a si mateixos. En «schedule» i en
    # «workflow_dispatch» no hi ha head_commit, i la condició els deixa passar.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[content-hub]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Sempre la punta de main, no el SHA que va crear l'execució: una
          # passada programada encuada darrere un push treballaria sobre un
          # arbre obsolet i tornaria a publicar la mateixa reflexió.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Només en la passada programada. Un push o un «Run workflow» a mà
      # publiquen sempre: així es pot forçar la republicació d'una correcció
      # del mateix dia, que és el que fa el pas de sota.
      - name: Queda res per publicar?
        id: pendent
        if: github.event_name == 'schedule'
        run: >-
          node automation/scripts/content-hub.mjs pending
          --what daily-reflection
          --input incoming/daily-reflection.json
          --public-dir public
          --state-dir .content-state

      - name: Res a fer
        if: github.event_name == 'schedule' && steps.pendent.outputs.pending != 'yes'
        run: echo "La reflexió que hi ha a incoming/ ja és publicada. La repesca no toca res."

      - name: Validar i publicar la reflexió del dia
        if: github.event_name != 'schedule' || steps.pendent.outputs.pending == 'yes'
        run: |
          if [ ! -f incoming/daily-reflection.json ]; then
            echo "No hi ha cap reflexió pendent; res a fer."
            exit 0
          fi
          node automation/scripts/content-hub.mjs ingest-daily-reflection \
            --input incoming/daily-reflection.json \
            --public-dir public \
            --state-dir .content-state

      - name: Executar proves de seguretat
        if: github.event_name != 'schedule' || steps.pendent.outputs.pending == 'yes'
        run: node --test automation/tests/content-hub.test.mjs

      - name: Publicar només si tot és correcte
        if: github.event_name != 'schedule' || steps.pendent.outputs.pending == 'yes'
        run: |
          git config user.name "intel·ligènciaartificial.cat bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/reflexio-diaria.js public/reflexions-arxiu.js .content-state/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[content-hub] publica la reflexió del dia"
          git pull --rebase origin main
          git push origin main
