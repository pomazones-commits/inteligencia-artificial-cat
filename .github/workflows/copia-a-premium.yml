name: Còpia al Premium (migració, d'un sol ús)

# Per què (06.11.2026): migració de l'allotjament del pla Business al Premium
# (doc del projecte «Migració a Premium — execució pas a pas»). Els llocs PHP/HTML
# no es poden moure automàticament entre plans de Hostinger, i al servidor hi ha
# coses que NO són al repositori: els MP3 (assets/audio), l'Àgora sencera
# (agora/, amb el seu config.php), data/ (subscriptors i estat del butlletí) i
# assets/videos, club i cartells. Aquest workflow els copia de servidor a
# servidor amb la mateixa clau de desplegament (autoritzada als dos comptes).
#
# - Només es llança a mà. No toca el repositori ni dispara cap desplegament.
# - Es pot llançar tantes vegades com calgui: rsync només porta el que ha canviat.
#   Cal tornar-lo a llançar just abans del canvi de domini per recollir el que
#   hagi entrat entretant (MP3 nous, subscriptors nous).
# - agora/config.php només es copia si encara no existeix al destí: al Premium
#   s'hi han de posar les dades de la base de dades nova i no s'han de trepitjar.
# - El repositori és públic i els logs també: no s'imprimeix cap llista de
#   fitxers de data/ ni cap credencial, només recomptes.
# - 🧹 Quan la migració estigui tancada, aquest fitxer s'ha d'esborrar.

on:
  workflow_dispatch:
    inputs:
      que:
        description: "Què es copia"
        type: choice
        options:
          - fitxers
          - base-de-dades-agora
        default: fitxers
      desti_ruta:
        description: "Ruta del lloc al Premium (p. ex. domains/<domini>/public_html)"
        required: true
      desti_host:
        description: "Servidor del Premium"
        default: "147.93.93.41"
      desti_usuari:
        description: "Usuari SSH del Premium"
        default: "u919593563"
      origen_host:
        description: "Servidor del Business"
        default: "92.113.28.34"
      origen_usuari:
        description: "Usuari SSH del Business"
        default: "u901078817"
      origen_ruta:
        description: "Ruta del lloc al Business"
        default: "domains/inteligencia-artificial.cat/public_html"

permissions:
  contents: read

concurrency:
  group: copia-a-premium
  cancel-in-progress: false

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      O_HOST: ${{ github.event.inputs.origen_host }}
      O_USER: ${{ github.event.inputs.origen_usuari }}
      O_PATH: ${{ github.event.inputs.origen_ruta }}
      D_HOST: ${{ github.event.inputs.desti_host }}
      D_USER: ${{ github.event.inputs.desti_usuari }}
      D_PATH: ${{ github.event.inputs.desti_ruta }}
    steps:
      - name: Prepara la clau
        run: |
          set -eu
          if [ -z "${SSH_KEY:-}" ]; then echo "::error::Falta el secret SSH_PRIVATE_KEY"; exit 1; fi
          case "$D_PATH" in
            ""|/*|*..*) echo "::error::desti_ruta ha de ser una ruta relativa sense '..'"; exit 1 ;;
          esac
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/k" && chmod 600 "$HOME/.ssh/k"
          echo "SSHO=ssh -i $HOME/.ssh/k -p 65002 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o BatchMode=yes" >> "$GITHUB_ENV"

      - name: Comprova que els dos servidors responen
        run: |
          set -eu
          $SSHO "$O_USER@$O_HOST" "test -d '$O_PATH' && echo 'Origen: carpeta trobada'"
          $SSHO "$D_USER@$D_HOST" "mkdir -p '$D_PATH' && test -w '$D_PATH' && echo 'Destí: carpeta a punt'"

      - name: Copia els fitxers (origen → runner → destí)
        if: github.event.inputs.que == 'fitxers'
        run: |
          set -eu
          mkdir -p /tmp/web
          EXCL="--exclude=*.bak-* --exclude=/deploy-sha.txt --exclude=/cron/ --exclude=/agora/config.php"
          echo "== Baixant del Business =="
          rsync -rltz --timeout=120 --stats $EXCL -e "$SSHO" "$O_USER@$O_HOST:$O_PATH/" /tmp/web/ | grep -E "Number of (regular )?files|Total transferred file size" || true
          echo "MP3 baixats: $(ls /tmp/web/assets/audio 2>/dev/null | grep -c '\.mp3$' || true)"
          echo "== Pujant al Premium =="
          rsync -rltz --timeout=120 --stats -e "$SSHO" /tmp/web/ "$D_USER@$D_HOST:$D_PATH/" | grep -E "Number of (regular )?files|Total transferred file size" || true
          echo "== agora/config.php =="
          if $SSHO "$D_USER@$D_HOST" "test -f '$D_PATH/agora/config.php'"; then
            echo "Ja existeix al destí: NO es toca."
          else
            $SSHO "$O_USER@$O_HOST" "cat '$O_PATH/agora/config.php'" | $SSHO "$D_USER@$D_HOST" "umask 077; cat > '$D_PATH/agora/config.php'"
            echo "Copiat (cal posar-hi les dades de la base de dades nova del Premium)."
          fi
          echo "== Recompte al destí =="
          $SSHO "$D_USER@$D_HOST" "cd '$D_PATH' && echo \"Fitxers: \$(find . -type f | wc -l) · MP3: \$(ls assets/audio 2>/dev/null | grep -c '\.mp3\$') · Mida: \$(du -sh . | cut -f1)\""

      - name: Copia la base de dades de l'Àgora
        if: github.event.inputs.que == 'base-de-dades-agora'
        run: |
          set -eu
          # Escriu un fitxer de credencials de MySQL (600) a partir de agora/config.php
          # del mateix servidor. Accepta claus pla o niuades (db_host, db.host,
          # database.name...). Mai s'imprimeixen els valors.
          cat > /tmp/cnf.php <<'PHP'
          <?php
          define('AGORA', true);
          $c = include $argv[1];
          if (!is_array($c)) { fwrite(STDERR, "config.php no retorna cap array\n"); exit(2); }
          $pla = [];
          $f = function ($a, $p) use (&$f, &$pla) { foreach ($a as $k => $v) { $kk = strtolower($p === '' ? (string)$k : "$p.$k"); if (is_array($v)) { $f($v, $kk); } else { $pla[$kk] = (string)$v; } } };
          $f($c, '');
          $tria = function ($noms) use ($pla) { foreach ($pla as $k => $v) { foreach ($noms as $n) { if (preg_match('/(^|[._])(db|database|mysql)[._]?' . $n . '$/', $k)) { return $v; } } } return ''; };
          $h = $tria(['host', 'hostname', 'server']) ?: 'localhost';
          $d = $tria(['name', 'dbname', 'database']);
          $u = $tria(['user', 'username']);
          $p = $tria(['pass', 'password', 'pwd']);
          if ($d === '' || $u === '') { fwrite(STDERR, "No trobo el nom o l'usuari de la BD. Claus: " . implode(', ', array_keys($pla)) . "\n"); exit(3); }
          umask(077);
          file_put_contents($argv[2], "[client]\nhost=$h\nuser=$u\npassword=\"" . addcslashes($p, "\"\\") . "\"\n");
          echo $d;
          PHP
          for s in O D; do
            eval H=\$${s}_HOST U=\$${s}_USER P=\$${s}_PATH
            $SSHO "$U@$H" "cat > ~/.migracio-cnf.php" < /tmp/cnf.php
            DB=$($SSHO "$U@$H" "php ~/.migracio-cnf.php '$P/agora/config.php' ~/.migracio.cnf")
            echo "${s}_DB=$DB" >> "$GITHUB_ENV"
            echo "$s: base de dades $DB"
          done
          if [ "$(grep '^O_DB=' "$GITHUB_ENV" | cut -d= -f2)" = "$(grep '^D_DB=' "$GITHUB_ENV" | cut -d= -f2)" ]; then
            echo "::error::Origen i destí apunten a la mateixa base de dades: agora/config.php del Premium encara té les dades del Business."
            exit 1
          fi

      - name: Bolca i importa
        if: github.event.inputs.que == 'base-de-dades-agora'
        run: |
          set -eu
          trap '$SSHO "$O_USER@$O_HOST" "rm -f ~/.migracio.cnf ~/.migracio-cnf.php"; $SSHO "$D_USER@$D_HOST" "rm -f ~/.migracio.cnf ~/.migracio-cnf.php"; rm -f /tmp/agora.sql' EXIT
          $SSHO "$O_USER@$O_HOST" "mysqldump --defaults-extra-file=.migracio.cnf --single-transaction --no-tablespaces --routines --default-character-set=utf8mb4 '$O_DB'" > /tmp/agora.sql
          echo "Bolcat: $(wc -c < /tmp/agora.sql) bytes, $(grep -c '^CREATE TABLE' /tmp/agora.sql) taules"
          $SSHO "$D_USER@$D_HOST" "mysql --defaults-extra-file=.migracio.cnf --default-character-set=utf8mb4 '$D_DB'" < /tmp/agora.sql
          echo "Importat. Taules al destí:"
          $SSHO "$D_USER@$D_HOST" "mysql --defaults-extra-file=.migracio.cnf -N -e 'SHOW TABLES' '$D_DB' | wc -l"
