name: Content Hub — completar l'edició

# Repesca d'un lot orfe: la fa la «Xarxa de seguretat», NO aquest workflow.
#
# El camí normal és el push a incoming/news-batch.json. Si aquell push es perd o
# el seu run mor (avaria de GitHub Actions del 06.08.2026), el trigger no es
# torna a disparar mai: els pushos posteriors toquen public/ i el lot queda orfe.
# El lot de les 18.05 del 06.08 va estar 11 hores sense publicar per això.
#
# 07.08.2026, primera versió: es va afegir aquí un `schedule` de repesca
# (:13/:43). Retirat el mateix matí, per dues raons:
#   1. La «Xarxa de seguretat» ja fa aquesta feina i millor — comprova l'estat
#      final real i rellança per workflow_dispatch el que calgui (contingut,
#      desplegament o àudio). Només li faltava cobrir la nit; ara el seu cron
#      és horari.
#   2. Aquell `schedule` era contraproduent: la «Xarxa de seguretat»
#      s'encadena a aquest workflow amb `workflow_run: [completed]`, o sigui
#      que 48 passades buides al dia aquí n'haurien arrossegat 48 allà.
#
# El pas «Queda res per publicar?» es queda tot i que ara mateix no s'executa
# mai (no hi ha esdeveniment `schedule`). És a posta: si algun dia es torna a
# afegir un cron, la guarda ja hi és. ⚠️ NO POSIS UN CRON SENSE ELLA:
# `ingest-news` NO és idempotent — cada passada incrementa batchCount, reescriu
# tots els segells de temps i deixa una còpia a .content-state/backups/, o sigui
# que un cron sense guarda ompliria el repositori de commits buits.

on:
  push:
    branches: [main]
    paths:
      - incoming/news-batch.json
  workflow_dispatch:

permissions:
  contents: write
  # 23.09.2026: per rellançar el desplegament i l'àudio (vegeu l'últim pas).
  actions: write

concurrency:
  group: content-hub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  completar-edicio:
    # Els commits del propi bot no es repesquen a si mateixos. En «schedule» i en
    # «workflow_dispatch» no hi ha head_commit, i la condició els deixa passar.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[content-hub]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperar el web i l'historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Sempre la punta de main, no el SHA que va crear l'execució. Sense
          # això, una passada programada encuada darrere un push (el grup de
          # concurrència en deixa passar una de cada cop) treballaria sobre un
          # arbre obsolet, veuria el lot com a pendent i el reingeriria.
          ref: main

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Només en la passada programada. Un push o un «Run workflow» a mà
      # ingereixen sempre: si el llances tu, és que el vols executar.
      - name: Queda res per publicar?
        id: pendent
        if: github.event_name == 'schedule'
        run: >-
          node automation/scripts/content-hub.mjs pending
          --what news
          --input incoming/news-batch.json
          --public-dir public
          --state-dir .content-state

      - name: Res a fer
        if: github.event_name == 'schedule' && steps.pendent.outputs.pending != 'yes'
        run: echo "El lot que hi ha a incoming/ ja és publicat. La repesca no toca res."

      - name: Validar i acumular el lot de Claude
        if: github.event_name != 'schedule' || steps.pendent.outputs.pending == 'yes'
        run: >-
          node automation/scripts/content-hub.mjs ingest-news
          --input incoming/news-batch.json
          --public-dir public
          --state-dir .content-state
          --target 20

      - name: Executar proves de seguretat
        if: github.event_name != 'schedule' || steps.pendent.outputs.pending == 'yes'
        run: node --test automation/tests/content-hub.test.mjs

      - name: Publicar només si tot és correcte
        if: github.event_name != 'schedule' || steps.pendent.outputs.pending == 'yes'
        run: |
          git config user.name "intel·ligènciaartificial.cat bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/news.js public/radar.js public/content-status.json public/data/ public/content/ .content-state/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[content-hub] completa l'edició automàtica"
          git pull --rebase origin main
          git push origin main

      # 23.09.2026 — CADENA TRENCADA QUAN EL LOT EL FUSIONA L'AUTO-FUSIÓ.
      # Si aquest run l'ha disparat «Auto-fusiona els lots» (workflow_dispatch
      # fet amb el GITHUB_TOKEN), GitHub NO crea cap `workflow_run` en acabar:
      # ni el desplegament, ni l'àudio, ni la xarxa de seguretat s'assabenten
      # que hi ha edició nova. Comprovat amb l'historial de runs: els Content
      # Hub disparats per push (pomazones-commits) sempre han encadenat el
      # desplegament; els disparats per github-actions[bot] (des del 22.09 a
      # la tarda, tots els lots) no l'han encadenat MAI. Resultat: el
      # desplegament del merge pujava la versió d'abans del Content Hub i la
      # web es quedava amb el lot anterior fins que un cron (:08/:38, que
      # GitHub deixa caure gairebé tots) o la xarxa ho repescaven — 1-2 h tard
      # els lots de les 10.05 i de les 14.05 del 23.09.
      # Un workflow_dispatch fet amb el GITHUB_TOKEN SÍ que crea run (és
      # l'excepció documentada), o sigui que el rellancem a mà. Si el run l'has
      # llançat tu a mà, també s'executa: com a molt hi haurà un desplegament
      # de més, idempotent (el grup de concurrència en cancel·la un).
      - name: Rellançar el desplegament i l'àudio (el workflow_run no arriba)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run desplega.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::No he pogut disparar el desplegament; el cron :08/:38 o la xarxa de seguretat ho hauran de repescar."
          gh workflow run audio-edicio.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::No he pogut disparar l'àudio; el cron :26 ho repescarà."
