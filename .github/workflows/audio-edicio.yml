name: Àudio de l'edició (veu en català)

on:
  # S'activa quan el Content Hub ha completat l'edició (els seus commits amb
  # GITHUB_TOKEN no disparen triggers de push, però workflow_run sí que funciona).
  workflow_run:
    # També després de «La reflexió del dia» (04.08.2026): així el seu MP3
    # (reflexio-AAAA-MM-DD.mp3) es genera de seguida i no ha d'esperar el
    # cron horari de repesca.
    workflows:
      - "Content Hub — completar l'edició"
      - "Content Hub — la reflexió del dia"
    types: [completed]
  workflow_dispatch:
    inputs:
      regenera:
        description: "Slugs de notícies rectificades a les quals cal refer l'àudio (separats per comes). Buit = passada normal."
        required: false
        default: ""
      refes_edicio:
        description: "Torna a fer TOTS els MP3 de l'edició actual (p. ex. després de canviar de veu)"
        type: boolean
        required: false
        default: false
  # Xarxa de seguretat (25.07.2026): passada horària. El script salta els MP3
  # que ja existeixen al servidor, així que si tot és al dia acaba en ~1 min; si
  # una passada anterior havia fallat (Hostinger caigut, com el matí
  # del 25.07), aquesta ho repesca sola.
  # 30.07.2026: minut canviat de :55 a :26. Els minuts rodons son els mes
  # congestionats i GitHub hi deixa caure moltes execucions programades.
  schedule:
    - cron: '26 * * * *'

permissions:
  contents: read
  # Per consultar si hi ha cap desplegament en curs abans de tocar el servidor.
  actions: read

concurrency:
  group: audio-edicio
  cancel-in-progress: false

jobs:
  audio:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Afegit el 30.07.2026. Aquest workflow i «Desplega la web a Hostinger»
      # compartien el limit de connexions FTP del compte. Des del canvi de
      # transport (02-04.08.2026: la web per rsync/SSH, l'audio per scp/SSH)
      # el xoc ja gairebe no pot passar, pero esperar el desplegament segueix
      # sent educat: prioritat a les noticies.
      - name: Espera que no hi hagi cap desplegament en curs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/desplega.yml/runs?per_page=20"
          compta='import json,sys; print(sum(1 for r in json.load(sys.stdin).get("workflow_runs", []) if r.get("status") != "completed"))'
          for i in $(seq 1 30); do
            actius=$(curl -sS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$api" | python3 -c "$compta" 2>/dev/null) || actius=""
            if [ -z "$actius" ]; then
              echo "Estat del desplegament no consultable; continuem."
              exit 0
            fi
            if [ "$actius" -eq 0 ]; then
              echo "Cap desplegament en curs; continuem."
              exit 0
            fi
            echo "Hi ha $actius desplegament(s) en curs o en cua; esperem 30 s ($i de 30)..."
            sleep 30
          done
          echo "::warning::El desplegament encara es en curs despres de 15 min; continuem igualment."

      - name: Descarrega el repositori
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Veus (decisió d'en Rafael del 23.10.2026), per ordre:
      # 1) la Joana d'edge-tts (gratuïta; va caure del 12 al 23.10.2026,
      #    rany2/edge-tts#490); 2) si Microsoft falla, Gemini «Kore» (crida HTTP
      #    des del script; clau al secret GEMINI_API_KEY); 3) si també falla,
      #    Piper, veu catalana neuronal LOCAL (corre al runner, sense claus).
      - name: Instal·la les veus (Joana i Piper)
        run: pip install --upgrade edge-tts && pip install piper-tts lameenc

      - name: Recupera la veu de recanvi de la memòria cau
        id: cache-piper
        uses: actions/cache@v4
        with:
          path: ~/piper-veus
          key: piper-ca_ES-upc_ona-medium-v1

      - name: Baixa la veu de recanvi si no hi és
        if: steps.cache-piper.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/piper-veus
          python -m piper.download_voices ca_ES-upc_ona-medium --download-dir ~/piper-veus \
            || echo "::warning::No s'ha pogut baixar la veu de recanvi; només es provarà Gemini."
          ls -la ~/piper-veus

      - name: Genera els MP3 de l'edició i puja'ls
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
          REGENERA: ${{ github.event.inputs.regenera || '' }}
          REFES_EDICIO: ${{ github.event.inputs.refes_edicio == 'true' && '1' || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python automation/scripts/genera_audio.py
