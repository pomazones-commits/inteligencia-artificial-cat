name: Àudio de l'edició (veu en català)

on:
  # S'activa quan el Content Hub ha completat l'edició (els seus commits amb
  # GITHUB_TOKEN no disparen triggers de push, però workflow_run sí que funciona).
  workflow_run:
    workflows: ["Content Hub — completar l'edició"]
    types: [completed]
  workflow_dispatch:
  # Xarxa de seguretat (25.07.2026): passada horària. El script salta els MP3
  # que ja existeixen al servidor, així que si tot és al dia acaba en ~1 min; si
  # una passada anterior havia fallat (Hostinger caigut, com el matí
  # del 25.07), aquesta ho repesca sola.
  # 30.07.2026: minut canviat de :55 a :26. Els minuts rodons son els mes
  # congestionats i GitHub hi deixa caure moltes execucions programades.
  schedule:
    - cron: '26 * * * *'

permissions:
  contents: read
  # Per consultar si hi ha cap desplegament en curs abans de tocar el servidor.
  actions: read

concurrency:
  group: audio-edicio
  cancel-in-progress: false

jobs:
  audio:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Afegit el 30.07.2026. Aquest workflow i «Desplega la web a Hostinger»
      # compartien el limit de connexions FTP del compte. Des del canvi de
      # transport (02-04.08.2026: la web per rsync/SSH, l'audio per scp/SSH)
      # el xoc ja gairebe no pot passar, pero esperar el desplegament segueix
      # sent educat: prioritat a les noticies.
      - name: Espera que no hi hagi cap desplegament en curs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/desplega.yml/runs?per_page=20"
          compta='import json,sys; print(sum(1 for r in json.load(sys.stdin).get("workflow_runs", []) if r.get("status") != "completed"))'
          for i in $(seq 1 30); do
            actius=$(curl -sS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$api" | python3 -c "$compta" 2>/dev/null) || actius=""
            if [ -z "$actius" ]; then
              echo "Estat del desplegament no consultable; continuem."
              exit 0
            fi
            if [ "$actius" -eq 0 ]; then
              echo "Cap desplegament en curs; continuem."
              exit 0
            fi
            echo "Hi ha $actius desplegament(s) en curs o en cua; esperem 30 s ($i de 30)..."
            sleep 30
          done
          echo "::warning::El desplegament encara es en curs despres de 15 min; continuem igualment."

      - name: Descarrega el repositori
        uses: actions/checkout@v4

      - name: Comprova que el transport respon (falla ràpid si no)
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Fase A2 (04.08.2026): si l'SSH esta configurat, la comprovacio
          # previa de l'FTP ja no cal — genera_audio.py prova l'SSH d'entrada
          # i, si no respon, degrada sol a l'FTP com a recurs.
          if [ -n "${SSH_PRIVATE_KEY:-}" ] && [ -n "${SSH_HOST:-}" ] && [ -n "${SSH_USER:-}" ]; then
            echo "Transport SSH configurat; no cal la comprovacio previa d'FTP."
            exit 0
          fi
          # Sense SSH: si l'FTP esta caigut, val mes fallar aqui en ~2 min que
          # gastar la mitja hora del job intentant pujar (va passar el
          # 25.07.2026: 26 min de timeouts i 0 MP3 pujats). La passada horaria
          # (cron :26) ho tornara a provar sola quan l'FTP torni a respondre.
          for i in 1 2 3 4 5; do
            if curl -sS --ftp-ssl-control --connect-timeout 15 \
                 -u "u901078817.claude:$FTP_PASSWORD" \
                 "ftp://srv1589.hstgr.io/" -o /dev/null; then
              echo "FTP OK (intent $i)."
              exit 0
            fi
            echo "FTP sense resposta (intent $i de 5); reintent en 20 s..."
            sleep 20
          done
          echo "::error::L'FTP de srv1589.hstgr.io no respon. La passada horaria (cron :26) ho reintentara sola."
          exit 1

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instal·la edge-tts
        run: pip install edge-tts

      - name: Genera els MP3 de l'edició i puja'ls
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: python automation/scripts/genera_audio.py
